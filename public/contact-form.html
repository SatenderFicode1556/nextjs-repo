<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Contact form</title></head>
  <body>
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">
      <p hidden><label>Leave this empty: <input name="bot-field"></label></p>
      <label>Name <input name="name" required></label>
      <label>Email <input name="email" type="email" required></label>
      <label>Company <input name="company"></label>
      <label>Interest <select name="interest"><option>Software development</option><option>AI and data</option><option>Cloud and AWS</option><option>Technology consulting</option><option>Something else</option></select></label>
      <label>Message <textarea name="message" required></textarea></label>
      <button type="submit">Send your message</button>
    </form>
  </body>
</html>
